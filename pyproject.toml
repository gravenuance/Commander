[project]
name = "commander"
version = "0.1.0"
description = "Track Archidekt Commander decks and research upgrades, prices and brackets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
cmdr = "commander.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commander"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: comments follow the house rule (only the non-obvious point), not per-symbol docs
    "COM812",  # conflicts with ruff format
    "T201",    # print is the CLI's output channel
    "TRY003",  # short inline exception messages are the house style
    "EM101",   # same
    "EM102",   # same
    "CPY001",  # the repo-level LICENSE covers every file
    "PLR0913", # injection seams are keyword-only; PLR0917 still caps positional arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest asserts
    "PLR2004", # literal expected values are the point of a test
    "INP001",  # tests are not a package
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

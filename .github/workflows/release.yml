name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag must be vMAJOR.MINOR.PATCH and match pyproject.toml
        run: |
          set -eu
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$version'"
            exit 1
          fi

  check:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked --group build

      - name: Write the exe's version resource
        shell: bash
        run: uv run python -I tools/version_info.py "$RUNNER_TEMP/version.txt"

      - name: Build Commander.exe
        shell: bash
        run: >-
          uv run --group build pyinstaller --noconfirm --clean --onefile --windowed
          --name Commander --icon src/commander/web/commander.ico
          --version-file "$RUNNER_TEMP/version.txt"
          --add-data "src/commander/web;commander/web" src/commander/app_main.py

      - name: Write SHA256SUMS.txt
        shell: bash
        run: |
          set -e
          cd dist
          sha256sum Commander.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Commander.exe

      - name: Extract this version's changelog section
        shell: bash
        run: |
          set -e
          uv run python -I - "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/notes.md" <<'PY'
          import re
          import sys
          from pathlib import Path

          version, out = sys.argv[1], Path(sys.argv[2])
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          heading = re.compile(rf"^## {re.escape(version)} - \d{{4}}-\d{{2}}-\d{{2}}\s*$")
          start = next((i for i, line in enumerate(lines) if heading.match(line)), None)
          if start is None:
              sys.exit(f"CHANGELOG.md has no '## {version} - <date>' section")
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          body = "\n".join(lines[start + 1 : end]).strip()
          if not body:
              sys.exit(f"CHANGELOG.md section for {version} is empty")
          out.write_text(body + "\n", encoding="utf-8")
          PY
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Commander.exe dist/SHA256SUMS.txt \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    # The app is Windows-only (Credential Manager, WebView2), so the checks run where it runs.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check

      # pyright is not a project dependency (locally it is a global npm install), so CI runs the same
      # npm package at the same version through npx. Dependabot cannot bump this pin: update it by hand.
      - name: pyright
        run: npx --yes pyright@1.1.414

      - name: pytest
        run: uv run pytest

      - name: Syntax-check the app's scripts
        shell: bash
        run: |
          set -e
          for f in src/commander/web/*.js; do
            node --check "$f"
          done
